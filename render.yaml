services:
  - type: web
    name: qbr-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CHECK_INTERVAL
        value: "21600"
      - key: REA_JWT
        sync: false
      - key: REA_PROFILE
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: qbr-state
          property: connectionString

databases:
  - name: qbr-state
    plan: free
    databaseName: qbr
    user: qbr
