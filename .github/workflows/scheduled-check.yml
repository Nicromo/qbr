name: Run scheduled bot check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hosted check
        env:
          CHECK_URL: ${{ secrets.CHECK_URL }}
        run: curl --fail --silent --show-error --max-time 55 "$CHECK_URL"
